# ==============================================================================
# CONFIGURAÇÃO DO SUPABASE CLI - EJC TRÂNSITO MONTE SIÃO
# ==============================================================================
project_id = "ejc-transito-monte-siao"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = false

[functions.checkout-process]
verify_jwt = false

[functions.pix-webhook]
verify_jwt = false
