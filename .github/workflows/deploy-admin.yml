name: Deploy EJC Admin

on:
  push:
    branches:
      - main
    paths:
      - "admin/**"
      - "css/**"
      - "fonts/**"
      - "images/**"
      - "js/theme.js"
      - "js/jszip.min.js"
      - "js/jspdf.umd.min.js"
      - "js/supabase-config.js"
      - "scripts/build-env.js"
      - "scripts/build-admin-dist.js"
      - "scripts/admin-static/**"
      - ".github/workflows/deploy-admin.yml"

  workflow_dispatch:

concurrency:
  group: deploy-ejc-admin
  cancel-in-progress: true

jobs:
  deploy-admin:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar bundle administrativo
        run: node scripts/build-admin-dist.js

      - name: Publicar no Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cloudflare-admin-dist --project-name=ejc-admin