name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-edge-functions.yml"

  workflow_dispatch:
    inputs:
      target_function:
        description: "Edge Function a ser publicada"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - admin-read
          - admin-write
          - checkout-process
          - pix-webhook
          - public-config
          - r2-presigned-url
          - sub-counts
          - whatsapp
          - send-email

concurrency:
  group: deploy-supabase-edge-functions
  cancel-in-progress: false

jobs:
  deploy-edge-functions:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configurar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validar segredos e configurações
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN ausente. Configure o Personal Access Token no GitHub Secrets."
            exit 1
          fi
          echo "✓ Credencial de acesso Supabase configurada com sucesso."

      - name: Identificar Edge Functions a publicar
        id: select_functions
        run: |
          FUNCTIONS=("admin-read" "admin-write" "checkout-process" "pix-webhook" "public-config" "r2-presigned-url" "sub-counts" "whatsapp" "send-email")

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.target_function }}"
            echo "Modo manual (workflow_dispatch). Alvo: $TARGET"
            for fn in "${FUNCTIONS[@]}"; do
              var_name="deploy_${fn//-/_}"
              if [ "$TARGET" = "all" ] || [ "$TARGET" = "$fn" ]; then
                echo "${var_name}=true" >> "$GITHUB_OUTPUT"
              else
                echo "${var_name}=false" >> "$GITHUB_OUTPUT"
              fi
            done
          else
            DIFF_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
            echo "Arquivos alterados no commit:"
            echo "$DIFF_FILES"

            WF_CHANGED=false
            if echo "$DIFF_FILES" | grep -q "^\.github/workflows/deploy-edge-functions\.yml"; then
              WF_CHANGED=true
            fi

            for fn in "${FUNCTIONS[@]}"; do
              var_name="deploy_${fn//-/_}"
              if [ "$WF_CHANGED" = "true" ] || echo "$DIFF_FILES" | grep -q "^supabase/functions/${fn}/"; then
                echo "${var_name}=true" >> "$GITHUB_OUTPUT"
              else
                echo "${var_name}=false" >> "$GITHUB_OUTPUT"
              fi
            done
          fi

      - name: Publicar Edge Function admin-read
        if: steps.select_functions.outputs.deploy_admin_read == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID || 'guppedddwnuvluhiaaas' }}
        run: |
          echo "Publicando supabase/functions/admin-read no projeto $PROJECT_REF..."
          supabase functions deploy admin-read --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Publicar Edge Function admin-write
        if: steps.select_functions.outputs.deploy_admin_write == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID || 'guppedddwnuvluhiaaas' }}
        run: |
          echo "Publicando supabase/functions/admin-write no projeto $PROJECT_REF..."
          supabase functions deploy admin-write --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Publicar Edge Function checkout-process
        if: steps.select_functions.outputs.deploy_checkout_process == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID || 'guppedddwnuvluhiaaas' }}
        run: |
          echo "Publicando supabase/functions/checkout-process no projeto $PROJECT_REF..."
          supabase functions deploy checkout-process --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Publicar Edge Function pix-webhook
        if: steps.select_functions.outputs.deploy_pix_webhook == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID || 'guppedddwnuvluhiaaas' }}
        run: |
          echo "Publicando supabase/functions/pix-webhook no projeto $PROJECT_REF..."
          supabase functions deploy pix-webhook --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Publicar Edge Function public-config
        if: steps.select_functions.outputs.deploy_public_config == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID || 'guppedddwnuvluhiaaas' }}
        run: |
          echo "Publicando supabase/functions/public-config no projeto $PROJECT_REF..."
          supabase functions deploy public-config --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Publicar Edge Function r2-presigned-url
        if: steps.select_functions.outputs.deploy_r2_presigned_url == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID || 'guppedddwnuvluhiaaas' }}
        run: |
          echo "Publicando supabase/functions/r2-presigned-url no projeto $PROJECT_REF..."
          supabase functions deploy r2-presigned-url --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Publicar Edge Function sub-counts
        if: steps.select_functions.outputs.deploy_sub_counts == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID || 'guppedddwnuvluhiaaas' }}
        run: |
          echo "Publicando supabase/functions/sub-counts no projeto $PROJECT_REF..."
          supabase functions deploy sub-counts --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Publicar Edge Function whatsapp
        if: steps.select_functions.outputs.deploy_whatsapp == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID || 'guppedddwnuvluhiaaas' }}
        run: |
          echo "Publicando supabase/functions/whatsapp no projeto $PROJECT_REF..."
          supabase functions deploy whatsapp --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Publicar Edge Function send-email
        if: steps.select_functions.outputs.deploy_send_email == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID || 'guppedddwnuvluhiaaas' }}
        run: |
          echo "Publicando supabase/functions/send-email no projeto $PROJECT_REF..."
          supabase functions deploy send-email --project-ref "$PROJECT_REF" --no-verify-jwt
