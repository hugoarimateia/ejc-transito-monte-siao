name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/admin-read/**"
      - "supabase/functions/admin-write/**"
      - "supabase/functions/sub-counts/**"
      - ".github/workflows/deploy-edge-functions.yml"

  workflow_dispatch:
    inputs:
      target_function:
        description: "Edge Function a ser publicada"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - admin-read
          - admin-write
          - sub-counts

concurrency:
  group: deploy-supabase-edge-functions
  cancel-in-progress: false

jobs:
  deploy-edge-functions:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configurar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validar segredos e configurações
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN ausente. Configure o Personal Access Token no GitHub Secrets."
            exit 1
          fi
          echo "✓ Credencial de acesso Supabase configurada com sucesso."

      - name: Identificar Edge Functions a publicar
        id: select_functions
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.target_function }}"
            echo "Modo manual (workflow_dispatch). Alvo: $TARGET"
            if [ "$TARGET" = "all" ]; then
              echo "deploy_admin_read=true" >> "$GITHUB_OUTPUT"
              echo "deploy_admin_write=true" >> "$GITHUB_OUTPUT"
              echo "deploy_sub_counts=true" >> "$GITHUB_OUTPUT"
            elif [ "$TARGET" = "admin-read" ]; then
              echo "deploy_admin_read=true" >> "$GITHUB_OUTPUT"
              echo "deploy_admin_write=false" >> "$GITHUB_OUTPUT"
              echo "deploy_sub_counts=false" >> "$GITHUB_OUTPUT"
            elif [ "$TARGET" = "admin-write" ]; then
              echo "deploy_admin_read=false" >> "$GITHUB_OUTPUT"
              echo "deploy_admin_write=true" >> "$GITHUB_OUTPUT"
              echo "deploy_sub_counts=false" >> "$GITHUB_OUTPUT"
            elif [ "$TARGET" = "sub-counts" ]; then
              echo "deploy_admin_read=false" >> "$GITHUB_OUTPUT"
              echo "deploy_admin_write=false" >> "$GITHUB_OUTPUT"
              echo "deploy_sub_counts=true" >> "$GITHUB_OUTPUT"
            fi
          else
            DIFF_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
            echo "Arquivos alterados no commit:"
            echo "$DIFF_FILES"

            DEPLOY_READ="false"
            DEPLOY_WRITE="false"
            DEPLOY_COUNTS="false"

            if echo "$DIFF_FILES" | grep -q "^supabase/functions/admin-read/"; then
              DEPLOY_READ="true"
            fi

            if echo "$DIFF_FILES" | grep -q "^supabase/functions/admin-write/"; then
              DEPLOY_WRITE="true"
            fi

            if echo "$DIFF_FILES" | grep -q "^supabase/functions/sub-counts/"; then
              DEPLOY_COUNTS="true"
            fi

            # Se o próprio arquivo de workflow foi alterado, publica todas as funções homologadas
            if echo "$DIFF_FILES" | grep -q "^\.github/workflows/deploy-edge-functions\.yml"; then
              DEPLOY_READ="true"
              DEPLOY_WRITE="true"
              DEPLOY_COUNTS="true"
            fi

            echo "deploy_admin_read=$DEPLOY_READ" >> "$GITHUB_OUTPUT"
            echo "deploy_admin_write=$DEPLOY_WRITE" >> "$GITHUB_OUTPUT"
            echo "deploy_sub_counts=$DEPLOY_COUNTS" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar Edge Function admin-read
        if: steps.select_functions.outputs.deploy_admin_read == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID || 'guppedddwnuvluhiaaas' }}
        run: |
          echo "=================================================================="
          echo "Publicando supabase/functions/admin-read no projeto $PROJECT_REF..."
          echo "=================================================================="
          supabase functions deploy admin-read --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Publicar Edge Function admin-write
        if: steps.select_functions.outputs.deploy_admin_write == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID || 'guppedddwnuvluhiaaas' }}
        run: |
          echo "=================================================================="
          echo "Publicando supabase/functions/admin-write no projeto $PROJECT_REF..."
          echo "=================================================================="
          supabase functions deploy admin-write --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Publicar Edge Function sub-counts
        if: steps.select_functions.outputs.deploy_sub_counts == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID || 'guppedddwnuvluhiaaas' }}
        run: |
          echo "=================================================================="
          echo "Publicando supabase/functions/sub-counts no projeto $PROJECT_REF..."
          echo "=================================================================="
          supabase functions deploy sub-counts --project-ref "$PROJECT_REF" --no-verify-jwt
